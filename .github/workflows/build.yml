name: build

# 两种触发，版本号都走"裸 x.y.z"体系：
#   push v* tag → 正式版（版本号 = tag 去 v 前缀，如 v0.1.0 → 0.1.0）；
#   手动触发    → 快照 <Cargo.toml 版本>-beta.N（N 按已有 tag 自动排），挂 Pre-release。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# 同一 ref 串行：两次手动触发不会算出同一个 beta.N（tag 在 release job 才创建）。
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: 计算版本号
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.calc.outputs.version }}
      tag: ${{ steps.calc.outputs.tag }}
      prerelease: ${{ steps.calc.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          # 全量历史 + tag：快照号要从已有 tag 里排 beta.N。
          fetch-depth: 0

      - name: 计算版本号
        id: calc
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            # 正式版：v0.1.0 → 0.1.0
            version="${GITHUB_REF_NAME#v}"
            tag="${GITHUB_REF_NAME}"
            prerelease=false
          else
            # 快照：基准版本取 Cargo.toml（下一个正式版），后缀 -beta.N 自动排。
            base="$(grep -m1 '^version = ' crates/yinhe-egui/Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')"
            if [[ ! "${base}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::无法从 crates/yinhe-egui/Cargo.toml 读到纯 x.y.z 格式的 version（读到：${base}）"
              exit 1
            fi
            if [[ -n "$(git tag -l "v${base}")" ]]; then
              echo "::error::正式版 v${base} 已发布，请先把 crates/yinhe-egui/Cargo.toml 的 version 改成下一个正式版"
              exit 1
            fi
            last_n="$(git tag -l "${base}-beta.*" | sed 's/.*-beta\.//' | grep -E '^[0-9]+$' | sort -n | tail -n1 || true)"
            version="${base}-beta.$(( ${last_n:-0} + 1 ))"
            tag="${version}"
            prerelease=true
          fi
          {
            echo "version=${version}"
            echo "tag=${tag}"
            echo "prerelease=${prerelease}"
          } >> "$GITHUB_OUTPUT"
          echo "本次版本号: ${version}（prerelease=${prerelease}）"

  macos:
    name: macOS (dmg)
    needs: version
    runs-on: macos-latest
    env:
      YINHE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-bundle
        # 与本地开发环境保持一致（cargo-bundle 不做签名，脚本里会补）
        run: cargo install cargo-bundle --version 0.11.0

      - name: Bundle, sign and package dmg
        run: cargo xtask bundle-macos

      - name: Rename dmg with version
        run: mv target/release/bundle/dmg/Yinhe.dmg "Yinhe-${YINHE_VERSION}.dmg"

      - name: Upload dmg
        uses: actions/upload-artifact@v4
        with:
          name: Yinhe-macos
          path: Yinhe-${{ env.YINHE_VERSION }}.dmg

  windows:
    name: Windows (zip)
    needs: version
    runs-on: windows-latest
    env:
      YINHE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release
        run: cargo build --release -p yinhe-egui

      - name: Package zip
        shell: pwsh
        run: Compress-Archive -Path target/release/yinhe-egui.exe -DestinationPath "Yinhe-$env:YINHE_VERSION-windows.zip"

      - name: Upload zip
        uses: actions/upload-artifact@v4
        with:
          name: Yinhe-windows
          path: Yinhe-${{ env.YINHE_VERSION }}-windows.zip

  linux:
    name: Linux (tar.gz, 构建冒烟测试)
    needs: version
    runs-on: ubuntu-latest
    env:
      YINHE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps (ALSA for cpal, fontconfig/freetype for font-kit)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libfontconfig1-dev libfreetype-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release
        run: cargo build --release -p yinhe-egui

      - name: Package tarball
        run: tar -czf "Yinhe-${YINHE_VERSION}-linux.tar.gz" -C target/release yinhe-egui

      - name: Upload tarball
        uses: actions/upload-artifact@v4
        with:
          name: Yinhe-linux
          path: Yinhe-${{ env.YINHE_VERSION }}-linux.tar.gz

  release:
    name: 挂到 GitHub Release
    needs: [version, macos, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          # 手动触发时 tag 还不存在，由本 action 创建（指向当前 commit）。
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.version }}
          prerelease: ${{ needs.version.outputs.prerelease }}
          generate_release_notes: true
          files: artifacts/*
