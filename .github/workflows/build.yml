name: build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    name: macOS (dmg)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-bundle
        # 与本地开发环境保持一致（cargo-bundle 不做签名，脚本里会补）
        run: cargo install cargo-bundle --version 0.11.0

      - name: Bundle, sign and package dmg
        run: ./scripts/bundle-macos.sh

      - name: Upload dmg
        uses: actions/upload-artifact@v4
        with:
          name: Yinhe-macos
          path: target/release/bundle/dmg/Yinhe.dmg

  windows:
    name: Windows (zip)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release
        run: cargo build --release -p yinhe-egui

      - name: Package zip
        shell: pwsh
        run: Compress-Archive -Path target/release/yinhe-egui.exe -DestinationPath Yinhe-windows.zip

      - name: Upload zip
        uses: actions/upload-artifact@v4
        with:
          name: Yinhe-windows
          path: Yinhe-windows.zip

  linux:
    name: Linux (tar.gz, 构建冒烟测试)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps (ALSA for cpal)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release
        run: cargo build --release -p yinhe-egui

      - name: Package tarball
        run: tar -czf Yinhe-linux.tar.gz -C target/release yinhe-egui

      - name: Upload tarball
        uses: actions/upload-artifact@v4
        with:
          name: Yinhe-linux
          path: Yinhe-linux.tar.gz

  release:
    name: 挂到 GitHub Release
    needs: [macos, windows, linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
