[workspace]
default-members = ["crates/yinhe-egui"]
members = [
    "crates/yinhe-types",
    "crates/yinhe-core",
    "crates/yinhe-midi",
    "crates/yinhe-midi-io",
    "crates/yinhe-yin",
    "crates/yinhe-archive",
    "crates/yinhe-wgpu",
    "crates/yinhe-audio",
    "crates/yinhe-synth",
    "crates/yinhe-dsp",
    "crates/yinhe-editor-core",
    "crates/yinhe-egui",
    "crates/yinhe-flutter",
    "crates/yinhe-clap",
    "crates/yinhe-mixer",
    "crates/yinhe-vst3",
    "crates/yinhe-memtrace",
    "crates/yinhe-fonts",
    "crates/yinhe-tests",
    "crates/yinhe-test-helpers",
    "crates/yinhe-theme",
    "xtask",
]
resolver = "2"

[workspace.package]
# 唯一基准版本：所有 crate 继承；快照发布 <version>-beta.N 也以它为准。
version = "0.1.0"

[workspace.dependencies]
wgpu = "30"
eframe = { version = "0.37", features = ["wgpu"] }
egui = "0.37"
egui_extras = "0.37"
pollster = "1"
bytemuck = { version = "1", features = ["derive"] }
midly = "0.5.3"
thiserror = "2"
half = "2"
rayon = "1"
rfd = "0.17.2"
tracing = "0.1"
tracing-subscriber = "0.3"
sysinfo = "0.39"
egui_material_icons = { version = "0.9", features = ["outline"] }
image = "0.25"
tempfile = "3"
memmap2 = "0.9"
libc = "0.2"
chrono = "0.4"
fontique = { version = "0.11.1", default-features = false, features = ["system", "fontconfig-dlopen"] }

# 跨 crate 共享依赖
serde = { version = "1", features = ["derive", "rc"] }
uuid = { version = "1", features = ["v4"] }
serde_json = "1"
cpal = "0.18"
dirs = "6"
rust-i18n = "4"

# debug 产物只服务于 AI 的 clippy/test 迭代，不用于手动调试：
# 自身保留行号（panic backtrace 可读），依赖不生成 DWARF（显著减小 target、编译更快）。
[profile.dev]
debug = 1

[profile.dev.package."*"]
debug = false

[profile.fast-release]
inherits = "release"                # 基于 release 默认设置
opt-level = 1                       # 基本优化，编译速度远快于 3
lto = false                         # 禁用链接时优化（大幅减少链接时间）
codegen-units = 16                  # 增加并行代码生成单元（最大 16，加速编译）
debug = 1                           # 行号表（函数名+行号），支持 backtrace 和 profiler
strip = "none"                      # 保留符号用于调试分析（体积换调试能力）
panic = "unwind"                  # 必须 unwind：panic=abort 会让 catch_unwind 失效，
                                # 任何线程 panic 都会直接杀死进程（丢未保存工程）
incremental = true                 # 启用增量编译（对多次构建友好）

[profile.release]
opt-level = 3            # 性能优先：最大运行速度优化
lto = "thin"             # 轻量 LTO：兼顾性能与编译速度（比 "z" 快得多，体积略增）
codegen-units = 16       # 并行代码生成：加速链接，对运行时性能影响极小
strip = true             # 体积第二：strip 仅去调试符号，不影响运行性能
panic = "unwind"          # 必须 unwind：音频初始化 catch_unwind 依赖它，
                         # abort 下线程 panic 直接杀进程（macOS EAGAIN 线程超限）
