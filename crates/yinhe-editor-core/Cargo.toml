[package]
name = "yinhe-editor-core"
version = "0.1.0"
edition = "2024"

[dependencies]
yinhe-types = { path = "../yinhe-types" }
yinhe-core = { path = "../yinhe-core" }
yinhe-mid2 = { path = "../yinhe-mid2" }
yinhe-yin = { path = "../yinhe-yin" }
yinhe-memtrace = { path = "../yinhe-memtrace" }
yinhe-theme = { path = "../yinhe-theme" }
dirs = { workspace = true }
uuid = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
#zstd = "0.13"
#bincode = "1"

[target.'cfg(target_os = "android")'.dependencies]
# 安卓端拿内部存储路径（getFilesDir）需要 JNI 桥接。
ndk-context = "0.1"
jni = "0.22"
