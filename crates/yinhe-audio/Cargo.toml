[package]
name = "yinhe-audio"
version.workspace = true
license.workspace = true
edition = "2024"

[dependencies]
xsynth-core = "0.4"
xsynth-soundfonts = "0.4"
symphonia = "0.5"
rubato = "0.15"

hound = "3.5"
crossbeam-channel = "0.5"
rayon = { workspace = true }
tracing = { workspace = true }
yinhe-synth = { path = "../yinhe-synth" }

yinhe-types = { path = "../yinhe-types" }
yinhe-core = { path = "../yinhe-core" }
yinhe-clap = { path = "../yinhe-clap" }
yinhe-mixer = { path = "../yinhe-mixer" }
yinhe-dsp = { path = "../yinhe-dsp" }
yinhe-memtrace = { path = "../yinhe-memtrace" }

[dev-dependencies]
pollster = { workspace = true }
tempfile = { workspace = true }
yinhe-midi = { path = "../yinhe-midi" }
yinhe-editor-core = { path = "../yinhe-editor-core" }

[target.'cfg(not(target_env = "ohos"))'.dependencies]
# 鸿蒙没有 ALSA：OHOS 走 OHAudio 后端（见 src/audio_out/ohos.rs）。
cpal = { workspace = true }
