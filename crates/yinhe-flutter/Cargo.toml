[package]
name = "yinhe-flutter"
version.workspace = true
edition = "2024"
description = "Yinhe Flutter(Android) 纹理桥：wgpu 渲染结果直接送入 Flutter Texture"

[lib]
# 仅作为 Android cdylib 加载：libyinhe_flutter.so
crate-type = ["cdylib"]

[dependencies]
wgpu = { workspace = true }
pollster = { workspace = true }
log = "0.4"
serde_json = { workspace = true }
jni = "0.22"
ndk-context = "0.1"
yinhe-types = { path = "../yinhe-types" }
yinhe-core = { path = "../yinhe-core" }
yinhe-editor-core = { path = "../yinhe-editor-core" }
yinhe-wgpu = { path = "../yinhe-wgpu" }
yinhe-theme = { path = "../yinhe-theme" }
yinhe-audio = { path = "../yinhe-audio" }
yinhe-midi = { path = "../yinhe-midi" }
yinhe-yin = { path = "../yinhe-yin" }
yinhe-archive = { path = "../yinhe-archive" }

[target.'cfg(target_os = "android")'.dependencies]
# 安卓上 stdout 不可见，日志必须走 logcat。
android_logger = "0.14"
