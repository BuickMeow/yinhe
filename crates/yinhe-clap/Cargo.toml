[package]
name = "yinhe-clap"
version.workspace = true
license.workspace = true
edition = "2024"

[dependencies]
clack-host = "0.1"
clack-extensions = { version = "0.1", features = [
    "clack-host",
    "audio-ports",
    "note-ports",
    "gui",
    "log",
    "latency",
    "params",
    "state",
    "state-context",
    "thread-check",
] }
thiserror = { workspace = true }
tracing = { workspace = true }
yinhe-mixer = { path = "../yinhe-mixer" }

[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2 = "0.6"
