[package]
name = "yinhe-egui"
version.workspace = true
edition = "2024"

[features]
default = []
# 启用 yinhe-memtrace 的分类内存追踪（有性能开销，默认关闭）。
# `cargo build --features memtrace` 开启。
memtrace = ["yinhe-memtrace/memtrace"]

[dependencies]
yinhe-theme = { path = "../yinhe-theme", features = ["egui"] }
yinhe-types = { path = "../yinhe-types" }
yinhe-core = { path = "../yinhe-core" }
yinhe-midi = { path = "../yinhe-midi" }
yinhe-midi-io = { path = "../yinhe-midi-io" }
yinhe-yin = { path = "../yinhe-yin" }
yinhe-archive = { path = "../yinhe-archive" }
yinhe-wgpu = { path = "../yinhe-wgpu" }
yinhe-audio = { path = "../yinhe-audio" }
yinhe-memtrace = { path = "../yinhe-memtrace" }
yinhe-fonts = { path = "../yinhe-fonts" }
yinhe-editor-core = { path = "../yinhe-editor-core" }
yinhe-mixer = { path = "../yinhe-mixer" }
yinhe-dsp = { path = "../yinhe-dsp" }
yinhe-vst3 = { path = "../yinhe-vst3" }
yinhe-clap = { path = "../yinhe-clap" }
cpal = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
dirs = { workspace = true }
eframe = { workspace = true }
egui = { workspace = true }
# svg feature：欢迎页左下角「銀」字徽标水印渲染（egui 官方 SVG 加载器，resvg）。
egui_extras = { workspace = true, features = ["svg"] }
wgpu = { workspace = true }
rfd = { workspace = true }
#pollster = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
sysinfo = { workspace = true }
egui_material_icons = { workspace = true }
chrono = { workspace = true }
image = { workspace = true }
bytemuck = { workspace = true }
rust-i18n = { workspace = true }
uuid = { workspace = true }
pinyin = "0.11.0"
deunicode = "1.6.2"
# 系统剪贴板（跨实例剪贴板；egui-winit 已用它，无新增编译负担）
arboard = "3.6"

[dev-dependencies]
yinhe-test-helpers = { path = "../yinhe-test-helpers" }
pollster = { workspace = true }
# UI 回归测试（无头模拟鼠标事件）：transport bar 双击最大化等交互
egui_kittest = { version = "0.37.0", features = ["wgpu"] }

[build-dependencies]
embed-resource = "3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-metal = "0.3.2"
raw-window-handle = "0.6"
muda = "0.19"

[package.metadata.bundle]
name = "Yinhe"
license = "AGPL-3.0"
identifier = "com.jieneng.yinhe"
icon = ["assets/yinhe.icns"]
resources = []
copyright = "Copyright (c) Jieneng 2026"
category = "Music"
short_description = "A MIDI editor built with Rust and egui."
long_description = "A MIDI editor built with Rust and egui."