[package]
name = "yinhe-midi"
version.workspace = true
license.workspace = true
edition = "2024"

[features]
# 启用 yinhe-memtrace 的分类内存追踪（诊断用，有性能开销）。
memtrace = ["yinhe-memtrace/memtrace"]

[dependencies]
yinhe-core = { path = "../yinhe-core" }
yinhe-types = { path = "../yinhe-types" }
yinhe-memtrace = { path = "../yinhe-memtrace" }
midly = { workspace = true }
rayon = { workspace = true }
thiserror = { workspace = true }
encoding_rs = "0.8"
memmap2 = { workspace = true }
serde = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
