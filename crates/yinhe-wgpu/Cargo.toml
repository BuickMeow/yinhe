[package]
name = "yinhe-wgpu"
version.workspace = true
edition = "2024"

[dependencies]
yinhe-core = { path = "../yinhe-core" }
yinhe-types = { path = "../yinhe-types" }
yinhe-memtrace = { path = "../yinhe-memtrace" }
yinhe-theme = { path = "../yinhe-theme" }
wgpu = { workspace = true }
bytemuck = { workspace = true }
half = { workspace = true }
rayon = { workspace = true }
stacker = "0.1"
tracing = { workspace = true }
log = "0.4"

[dev-dependencies]
yinhe-midi = { path = "../yinhe-midi" }
yinhe-test-helpers = { path = "../yinhe-test-helpers" }
pollster = { workspace = true }
# glsl-out：把 shader 翻译成 GLSL ES 3.20（Android GLES 后端实际走这条路），
# 在无 GPU 的 CI 上也能提前发现 naga 侧的类型/版本问题。
naga = { version = "30", features = ["wgsl-in", "glsl-out"] }
