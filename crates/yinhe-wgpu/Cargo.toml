[package]
name = "yinhe-wgpu"
version.workspace = true
edition = "2024"

[dependencies]
yinhe-core = { path = "../yinhe-core" }
yinhe-types = { path = "../yinhe-types" }
yinhe-memtrace = { path = "../yinhe-memtrace" }
yinhe-theme = { path = "../yinhe-theme" }
wgpu = { workspace = true }
bytemuck = { workspace = true }
half = { workspace = true }
rayon = { workspace = true }
stacker = "0.1"
tracing = { workspace = true }
log = "0.4"

[dev-dependencies]
yinhe-midi = { path = "../yinhe-midi" }
yinhe-test-helpers = { path = "../yinhe-test-helpers" }
pollster = { workspace = true }
# glsl-out：校验 GLES 3.0 降级路径（wgpu-hal 的 GLES 后端实际用 GLSL ES 3.00）。
naga = { version = "30", features = ["wgsl-in", "glsl-out"] }
